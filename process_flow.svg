<circle cx="220" cy="132" r="12" fill="#f2a900"/><text x="220" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#222">2</text>
<text x="270.0" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3d3e">Validation</text>
<text x="270.0" y="184" font-size="11" text-anchor="middle" fill="#555">Fields, budget,</text>
<text x="270.0" y="198" font-size="11" text-anchor="middle" fill="#555">dates</text>
<line x1="340" y1="158.0" x2="358" y2="158.0" stroke="#0f3d3e" stroke-width="2" marker-end="url(#a)"/>
<rect x="360" y="110" width="140" height="96" rx="8" fill="#eef4f3" stroke="#0f3d3e" stroke-width="1.5"/>
<circle cx="380" cy="132" r="12" fill="#f2a900"/><text x="380" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#222">3</text>
<text x="430.0" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3d3e">Rule Engine</text>
<text x="430.0" y="184" font-size="11" text-anchor="middle" fill="#555">Budget → approval</text>
<text x="430.0" y="198" font-size="11" text-anchor="middle" fill="#555">chain</text>
<line x1="500" y1="158.0" x2="518" y2="158.0" stroke="#0f3d3e" stroke-width="2" marker-end="url(#a)"/>
<rect x="520" y="110" width="140" height="96" rx="8" fill="#eef4f3" stroke="#0f3d3e" stroke-width="1.5"/>
<circle cx="540" cy="132" r="12" fill="#f2a900"/><text x="540" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#222">4</text>
<text x="590.0" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3d3e">Approvals</text>
<text x="590.0" y="184" font-size="11" text-anchor="middle" fill="#555">Sequential, role-</text>
<text x="590.0" y="198" font-size="11" text-anchor="middle" fill="#555">checked</text>
<line x1="660" y1="158.0" x2="678" y2="158.0" stroke="#0f3d3e" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="110" width="140" height="96" rx="8" fill="#0f3d3e" stroke="#0f3d3e" stroke-width="1.5"/>
<circle cx="700" cy="132" r="12" fill="#f2a900"/><text x="700" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#222">5</text>
<text x="750.0" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">Governance Check</text>
<text x="750.0" y="184" font-size="11" text-anchor="middle" fill="#e8f0ef">Fully Approved? all</text>
<text x="750.0" y="198" font-size="11" text-anchor="middle" fill="#e8f0ef">levels logged?</text>
<line x1="820" y1="158.0" x2="838" y2="158.0" stroke="#0f3d3e" stroke-width="2" marker-end="url(#a)"/>
<rect x="840" y="110" width="140" height="96" rx="8" fill="#eef4f3" stroke="#0f3d3e" stroke-width="1.5"/>
