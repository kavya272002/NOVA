<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" font-family="Helvetica,Arial,sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="44" font-size="26" font-weight="700" fill="#0f3d3e">Nova Consumer Brands - Campaign Governance Process Flow</text>
<text x="40" y="70" font-size="14" fill="#555">Every transition is written to AUDIT_TRAIL. Approval decisions are written to APPROVAL_LOG (append-only).</text>
<defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0f3d3e"/></marker></defs>
<rect x="40" y="110" width="140" height="96" rx="8" fill="#eef4f3" stroke="#0f3d3e" stroke-width="1.5"/>
<circle cx="60" cy="132" r="12" fill="#f2a900"/><text x="60" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#222">1</text>
<text x="110.0" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3d3e">Campaign Request</text>
<text x="110.0" y="184" font-size="11" text-anchor="middle" fill="#555">Form / Create</text>
<text x="110.0" y="198" font-size="11" text-anchor="middle" fill="#555">Campaign</text>
<line x1="180" y1="158.0" x2="198" y2="158.0" stroke="#0f3d3e" stroke-width="2" marker-end="url(#a)"/>
