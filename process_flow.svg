<line x1="980" y1="158.0" x2="998" y2="158.0" stroke="#0f3d3e" stroke-width="2" marker-end="url(#a)"/>
<rect x="1000" y="110" width="140" height="96" rx="8" fill="#eef4f3" stroke="#0f3d3e" stroke-width="1.5"/>
<circle cx="1020" cy="132" r="12" fill="#f2a900"/><text x="1020" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#222">7</text>
<text x="1070.0" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3d3e">Lead Tracking</text>
<text x="1070.0" y="184" font-size="11" text-anchor="middle" fill="#555">LEAD_DATA</text>
<line x1="1140" y1="158.0" x2="1158" y2="158.0" stroke="#0f3d3e" stroke-width="2" marker-end="url(#a)"/>
<rect x="1160" y="110" width="140" height="96" rx="8" fill="#eef4f3" stroke="#0f3d3e" stroke-width="1.5"/>
<circle cx="1180" cy="132" r="12" fill="#f2a900"/><text x="1180" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#222">8</text>
<text x="1230.0" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3d3e">Analytics</text>
<text x="1230.0" y="184" font-size="11" text-anchor="middle" fill="#555">KPIs, ROAS, ROI</text>
<line x1="1300" y1="158.0" x2="1318" y2="158.0" stroke="#0f3d3e" stroke-width="2" marker-end="url(#a)"/>
<rect x="1320" y="110" width="140" height="96" rx="8" fill="#eef4f3" stroke="#0f3d3e" stroke-width="1.5"/>
<circle cx="1340" cy="132" r="12" fill="#f2a900"/><text x="1340" y="137" font-size="13" font-weight="700" text-anchor="middle" fill="#222">9</text>
<text x="1390.0" y="166" font-size="14" font-weight="700" text-anchor="middle" fill="#0f3d3e">Dashboard</text>
<text x="1390.0" y="184" font-size="11" text-anchor="middle" fill="#555">Control Center</text>
<path d="M270.0,206 V276" stroke="#b3261e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="190.0" y="278" width="160" height="50" rx="8" fill="#fdecea" stroke="#b3261e"/>
<text x="270.0" y="299" font-size="12" fill="#b3261e" text-anchor="middle">Validation Failed</text>
<text x="270.0" y="316" font-size="12" fill="#555" text-anchor="middle">Fix and resubmit</text>
<path d="M590.0,206 V276" stroke="#b3261e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="440.0" y="278" width="180" height="64" rx="8" fill="#fdecea" stroke="#b3261e"/>
<text x="530.0" y="299" font-size="12" fill="#b3261e" text-anchor="middle">Rejected / Rework</text>
<text x="530.0" y="316" font-size="11" fill="#555" text-anchor="middle">Requester told why;</text>
<text x="530.0" y="331" font-size="11" fill="#555" text-anchor="middle">resubmit restarts chain</text>
<path d="M750.0,206 V276" stroke="#b3261e" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="680.0" y="278" width="140" height="50" rx="8" fill="#fdecea" stroke="#b3261e"/>
<text x="750.0" y="299" font-size="12" fill="#b3261e" text-anchor="middle">BLOCKED</text>
<text x="750.0" y="316" font-size="12" fill="#555" text-anchor="middle">Attempt is audited</text>
<text x="40" y="396" font-size="15" font-weight="700" fill="#0f3d3e">Approval routing (read from APPROVAL_RULES, editable by Business Head)</text>
<rect x="40" y="416" width="230" height="30" rx="5" fill="#f2a900"/><text x="155" y="436" font-size="13" font-weight="700" text-anchor="middle" fill="#222">Below ₹50,000</text>
<rect x="274" y="416" width="700" height="30" rx="5" fill="#eef4f3" stroke="#0f3d3e"/><text x="288" y="436" font-size="13" fill="#0f3d3e">Regional Manager</text>
<rect x="40" y="454" width="230" height="30" rx="5" fill="#f2a900"/><text x="155" y="474" font-size="13" font-weight="700" text-anchor="middle" fill="#222">₹50,000 to ₹2,00,000</text>
<rect x="274" y="454" width="700" height="30" rx="5" fill="#eef4f3" stroke="#0f3d3e"/><text x="288" y="474" font-size="13" fill="#0f3d3e">Regional Manager → Marketing Manager</text>
<rect x="40" y="492" width="230" height="30" rx="5" fill="#f2a900"/><text x="155" y="512" font-size="13" font-weight="700" text-anchor="middle" fill="#222">Above ₹2,00,000</text>
<rect x="274" y="492" width="700" height="30" rx="5" fill="#eef4f3" stroke="#0f3d3e"/><text x="288" y="512" font-size="13" fill="#0f3d3e">Regional Manager → Marketing Manager → Marketing Head → Business Head</text>
</svg>